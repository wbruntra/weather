name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # This project targets Bun 1.4. Until 1.4 is released, `latest`
          # resolves to the 1.3.x line, so track canary — it currently builds
          # 1.4.0. Switch to `1.4.x` once 1.4 ships.
          bun-version: canary

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Tests build their own throwaway database from migrations, so no
      # database setup step is needed here.
      - name: Test
        run: bun run test

      - name: Build frontend
        run: bun run build

      - name: Verify a clean checkout can bootstrap
        run: bun run db:migrate && bun run db:seed
