<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/weather/favicon.svg" />
    <link rel="apple-touch-icon" href="/weather/apple-touch-icon.png" />
    <link rel="manifest" href="/weather/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1a14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Weather" />
    <title>Weather</title>
    <meta name="description" content="Local weather, hourly and 7-day forecasts for any city." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600&family=Fira+Code:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before paint so the selected theme doesn't flash on load.
      ;(function () {
        // Mirrors resolveTheme in src/hooks/useTheme.ts.
        var now = Date.now()
        var theme
        try {
          var o = JSON.parse(localStorage.getItem('weather-theme-override'))
          if (o && (o.until === null || now < o.until)) theme = o.theme
          if (!theme) {
            var t = JSON.parse(localStorage.getItem('weather-sun-transitions')) || []
            for (var i = 0; i < t.length && t[i].at <= now; i++)
              theme = t[i].day ? 'light' : 'dark'
          }
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light' && theme !== 'dracula') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
        var bg = { dark: '#0d1a14', light: '#eef4fa', dracula: '#282a36' }[theme]
        document.querySelector('meta[name="theme-color"]').content = bg
      })()
    </script>
    <script type="module" crossorigin src="/weather/assets/index-f_WyUDZJ.js"></script>
    <link rel="stylesheet" crossorigin href="/weather/assets/index-oaaayUrt.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
